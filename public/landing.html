<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Embark Digitals · Client demonstrations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f7f7f4; --panel: #ffffff; --ink: #1f2a2e; --muted: #66706f; --line: #e3e6e2; --brand: #28697a; --accent: #f09364; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font-family: Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; padding: 24px max(16px, env(safe-area-inset-left)); }
  main { max-width: 520px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--brand); border-radius: 16px; padding: 32px; }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--brand); color: #fff; font-weight: 800; display: grid; place-items: center; position: relative; }
  .mark::after { content: ""; position: absolute; right: 7px; bottom: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .kicker { margin: 22px 0 6px; font-size: 11px; letter-spacing: 2px; font-weight: 800; text-transform: uppercase; color: var(--brand); }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.6px; line-height: 1.2; }
  p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 12px 0 0; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ED</div>
    <div class="kicker">Embark Digitals</div>
    <h1>Client demonstrations</h1>
    <p>Each demonstration has its own link, shared directly with the client it was prepared for. If you were sent a link, please open it as provided.</p>
    <p>For access, contact your Embark Digitals representative.</p>
  </main>
</body>
</html>
